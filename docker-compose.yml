# ローカル開発用。`docker compose up` で Postgres(pgvector) + app が上がることを
# 最初の CI/開発ゲートにする（docs/preparation/infra/setup-checklist.md）。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: russell
      POSTGRES_PASSWORD: russell
      POSTGRES_DB: russell
    ports:
      - "5432:5432"
    volumes:
      - russell-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U russell"]
      interval: 5s
      timeout: 3s
      retries: 10

  # スキーマを作るのはこのワンショットだけ（app は起動時に DDL を流さない, §11）。
  # 本番でも「デプロイの前段でマイグレーションを1回流す」という同じ形にする。
  migrate:
    build: .
    command: ["node", "apps/agent/dist/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://russell:russell@db:5432/russell

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://russell:russell@db:5432/russell
      RUSSELL_MODE: dryrun
      # レベル3（別経路）。1 で完全沈黙。DB を読まないので DB 障害時にも効く（§12-7）
      RUSSELL_KILL: "0"
      # ANTHROPIC_API_KEY / SLACK_* / RUSSELL_KILL_OPERATORS / RUSSELL_ADMIN_CHANNEL は
      # .env から渡す（本番は Secret Manager）。RUSSELL_KILL_OPERATORS が未設定だと
      # `/russell start`（解除）は誰も実行できない（fail-closed）。
    env_file:
      - path: .env
        required: false

volumes:
  russell-pgdata:
