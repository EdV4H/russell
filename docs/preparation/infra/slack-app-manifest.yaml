# Slack アプリのマニフェスト（個体1号 Bob）。
#
# api.slack.com/apps → Create New App → **From a manifest** に貼る。
# 個体ごとに別アプリ（B-2 決定）なので、2体目は display_information と bot_user の
# 名前だけ差し替えて使う。
#
# 実地で繋いだときに漏れて詰まった箇所には ★ を付けてある。画面上は設定済みに見えるのに
# 動かない、という形で出るので、マニフェストから作れば踏まない。
#
# 関連: setup-checklist.md（作成手順）/ ../../concepts/13-surfaces.md（何を拾うか）
#      ../../reference/35-killswitch.md（/russell）

display_information:
  name: Bob
  description: 記憶を持つ同僚エージェント（Russell 個体1号）
  background_color: "#2c3e50"

features:
  bot_user:
    display_name: Bob
    always_online: false
  # ★ これが無いと DM の入力欄が出ない（「このアプリへのメッセージ送信はオフにされています」）。
  #    im:history と message.im を入れていても、ここが off だと利用者が打てない。
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  slash_commands:
    - command: /russell
      description: キルスイッチ。自発行動を凍結する
      usage_hint: "stop [理由] | start | status"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history # パブリックチャンネルのスレッド追従
      - groups:history # プライベートチャンネルでも使うなら。不要なら消してよい（最小スコープ）
      - im:history
      - chat:write
      - reactions:write # 📝「メモしました」（§10.1）
      - commands # /russell（§12-4）

settings:
  event_subscriptions:
    bot_events:
      - app_mention
      # ★ message.channels が無いとスレッドの続きが配信されない。mention は届くので
      #    「繋がっているのに追従だけしない」という紛らわしい症状になる。
      - message.channels
      - message.groups # groups:history を使わないなら消す
      - message.im
  # HITL の承認ボタン（Block Kit）は P0 スコープ外。必要になったら有効化する。
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
